# XcodeGen spec. Regenerate the project with:
#   brew install xcodegen && cd ThreadMap && xcodegen generate
#
# The .xcodeproj is intentionally not committed — it's generated output, and
# generating it means the file list can't drift from what's on disk.
name: ThreadMap
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""          # set your team, or configure it in Xcode

targets:
  ThreadMap:
    type: application
    platform: iOS
    sources:
      - path: ThreadMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ThreadMap
        PRODUCT_NAME: Thread Map
        INFOPLIST_FILE: ThreadMap/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThreadMap/ThreadMap.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: HomeKit.framework
      - sdk: ThreadNetwork.framework
      - sdk: Network.framework
